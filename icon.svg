<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Music Player PWA icon</title>
  <desc id="desc">A vinyl record with a music note on a purple blue background.</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="40" x2="440" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.45" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
    <radialGradient id="disc" cx="42%" cy="36%" r="68%">
      <stop offset="0" stop-color="#30364d"/>
      <stop offset="0.46" stop-color="#141827"/>
      <stop offset="1" stop-color="#060812"/>
    </radialGradient>
    <linearGradient id="label" x1="214" y1="208" x2="298" y2="312" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <path d="M88 392c72-18 114-5 172 23 57 28 112 32 164-5v78H88z" fill="#0f172a" opacity="0.16"/>

  <g filter="url(#shadow)">
    <circle cx="256" cy="266" r="156" fill="url(#disc)"/>
    <circle cx="256" cy="266" r="132" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
    <circle cx="256" cy="266" r="104" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
    <circle cx="256" cy="266" r="76" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
    <circle cx="256" cy="266" r="50" fill="url(#label)"/>
    <circle cx="256" cy="266" r="10" fill="#111827" opacity="0.82"/>
  </g>

  <path
    d="M322 124c0-8 6-15 14-17l72-15c10-2 20 6 20 17v35c0 8-6 15-14 17l-56 12v110c0 31-28 56-63 56-28 0-50-16-50-37 0-22 22-38 50-38 10 0 19 2 27 6z"
    fill="#f8fafc"/>
  <path
    d="M322 124c0-8 6-15 14-17l72-15c10-2 20 6 20 17v35c0 8-6 15-14 17l-56 12v110c0 31-28 56-63 56-28 0-50-16-50-37 0-22 22-38 50-38 10 0 19 2 27 6z"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.28"
    stroke-width="8"
    stroke-linejoin="round"/>
</svg>
